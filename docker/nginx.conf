
server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.html;

    # Docker's embedded DNS — required because proxy_pass below uses a variable.
    resolver 127.0.0.11 ipv6=off valid=30s;

    access_log /var/www/html/logs/access.log;
    error_log  /var/www/html/logs/error.log;

    # ---- custom error pages -------------------------------------------------
    error_page 404 /errorFolder/404.html;
    error_page 500 502 503 504 /errorFolder/500.html;
    location ^~ /errorFolder/ {
        internal;
    }

    # ---- SugarCRM REST proxy ---------------------------------------------
    # Frontend calls /backend/rest/v11_26/...  ->  https://<sugar>/rest/v11_26/...
    location /backend/ {
        set $sugar_host local-crm.cutandcare.co.uk;

        # Preflight: answer here before the rewrite's `break` ends this phase.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Content-Type, Authorization, OAuth-Token, Cache-Control' always;
            add_header Content-Length 0;
            return 204;
        }

        rewrite ^/backend/(.*)$ /$1 break;

        proxy_pass https://$sugar_host;
        proxy_http_version 1.1;

        # TLS to a Cloudflare-fronted origin: send SNI + verify against the name.
        proxy_ssl_server_name on;
        proxy_ssl_name $sugar_host;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        proxy_set_header Host $sugar_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";

        # Let SugarCRM's own error bodies through instead of our error_page.
        proxy_intercept_errors off;

        # CORS — harmless when same-origin, needed if the app is ever served
        # from a different host than this proxy.
        add_header Access-Control-Allow-Origin  $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization, OAuth-Token, Cache-Control' always;
    }

    # ---- PWA: never let the service worker or manifest go stale ----------
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Fingerprint-free but rarely-changing assets — safe to cache hard.
    location ~* ^/(icons|vendor)/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # ---- static frontend --------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # Silence dev-tooling probes that would otherwise fill the error log.
    location = /.well-known/appspecific/com.chrome.devtools.json {
        return 204;
        access_log off;
    }
}
