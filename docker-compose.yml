
services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build:
      context: docker # Or the path to your Dockerfile directory, e.g., ./docker/php
      dockerfile: ./Dockerfile-php
    volumes:
      - ./src:/var/www/html
    deploy:
      replicas: 1