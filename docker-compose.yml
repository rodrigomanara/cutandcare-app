services:
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - php_backend

  php_backend:
    build:
      context: docker
      dockerfile: ./Dockerfile-php
    volumes:
      - ./src:/var/www/html
      - ./docker/errorFolder:/var/www/html/errorFolder
    deploy:
      replicas: 1