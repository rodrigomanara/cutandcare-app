<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
  <title>Sign in · Cut &amp; Care Bookings</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="favicon.ico" sizes="48x48" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="C&amp;C Bookings" />

  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="auth-body">
  <main class="auth-card">
    <div class="auth-card__content">
      <img src="https://www.cutandcare.co.uk/image/cutandcare-log.svg" style="
    width: 100%;
">
    </div>
    <p class="auth-subtitle">Booking system</p>

    <p id="login-error" class="form-error" role="alert" hidden></p>

    <form id="login-form" novalidate>
      <label class="field">
        <span class="field-label">Username or email</span>
        <input id="username" name="username" type="text" autocomplete="username"
               autocapitalize="none" autocorrect="off" spellcheck="false" required />
      </label>

      <label class="field">
        <span class="field-label">Password</span>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </label>

      <button id="login-submit" type="submit" class="btn btn--primary btn--block">Sign in</button>
    </form>
  </main>

  <script type="module" src="js/pages/login.js"></script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>
